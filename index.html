<!DOCTYPE html>
<html lang="sl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vodovod Kaplja vas</title>

<style>

body{
    font-family: Arial;
    background:#f3f3f3;
    padding:20px;
}

.card{
    background:white;
    max-width:900px;
    margin:auto;
    padding:25px;
    border-radius:14px;
    box-shadow:0 0 12px rgba(0,0,0,0.12);
}

h1{
    margin-top:0;
    margin-bottom:10px;
}

.bigstatus{
    font-size:34px;
    font-weight:bold;
    margin-bottom:10px;
}

.ok{
    color:green;
}

.alarm{
    color:red;
}

.offline{
    color:darkred;
}

.time{
    color:#666;
    margin-bottom:25px;
}

.section{
    margin-top:25px;
}

.item{
    margin:10px 0;
    font-size:22px;
}

.small{
    font-size:18px;
}

pre{
    white-space:pre-wrap;
    background:#f5f5f5;
    padding:20px;
    border-radius:10px;
    overflow:auto;
    font-size:15px;
    margin-top:30px;
}

</style>

</head>

<body>

<div class="card">

<h1>VODOVOD Kaplja vas</h1>

<div id="main_status" class="bigstatus">
NALAGANJE...
</div>

<div id="update_time" class="time">
-
</div>

<div class="section">

<div class="item">
Status črpanja:
<b id="pump_state">-</b>
</div>

<div class="item">
Danes:
<b id="daily_hours">-</b> h
=
<b id="daily_m3">-</b> m3
</div>

</div>

<div class="section">

<div class="item small">
Zadnji dogodek:
</div>

<div class="item small">
<b id="last_event">-</b>
</div>

</div>

<pre id="report_box">
NALAGANJE REPORTA...
</pre>

</div>

<script>

const SUPABASE_URL =
'https://bndblzdwhqxrgxatqrxm.supabase.co';

const SUPABASE_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZGJsemR3aHF4cmd4YXRxcnhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjE0MTgsImV4cCI6MjA5NDA5NzQxOH0.OmKY2hWbE1-V4VOqeaQCLBt4vmpUg8oOqV7SupcN4EE';

async function loadData(){

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/pump_status?select=*&order=id.desc&limit=1`,
        {
            headers:{
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
            }
        }
    );

    const data = await response.json();

    if(!data.length){
        return;
    }

    const d = data[0];

    const updateDate = new Date(d.created_at);
    const now = new Date();

    const diffHours =
        (now - updateDate) / 1000 / 60 / 60;

    const localTime =
        updateDate.toLocaleString('sl-SI');

    document.getElementById('update_time').innerHTML =
        'Posodobljeno: ' + localTime;

    // OFFLINE

    if(diffHours >= 3){

        document.getElementById('main_status')
            .innerHTML = '🔴 VODOVOD OFFLINE';

        document.getElementById('main_status')
            .className = 'bigstatus offline';

    }

    // ALARM

    else if(d.alarm){

        document.getElementById('main_status')
            .innerHTML = '⚠ ALARM';

        document.getElementById('main_status')
            .className = 'bigstatus alarm';

    }

    // OK

    else{

        document.getElementById('main_status')
            .innerHTML = '🟢 VODOVOD OK';

        document.getElementById('main_status')
            .className = 'bigstatus ok';
    }

    // stanje pumpe

    if(d.pump_running){

        document.getElementById('pump_state')
            .innerHTML = 'ČRPA';

    } else {

        document.getElementById('pump_state')
            .innerHTML = 'MIRUJE';
    }

    document.getElementById('daily_hours')
        .innerHTML = d.daily_hours;

    document.getElementById('daily_m3')
        .innerHTML = d.daily_m3;

    document.getElementById('last_event')
        .innerHTML = d.last_event;

    document.getElementById('report_box')
        .innerHTML = d.report;
}

loadData();

setInterval(loadData,30000);

</script>

</body>
</html>

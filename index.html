<style>

body{
    font-family: Arial, sans-serif;
    background:#f3f3f3;
    padding:12px;
    margin:0;
}

.card{
    background:white;
    max-width:760px;
    margin:auto;
    padding:18px;
    border-radius:14px;
    box-shadow:0 0 12px rgba(0,0,0,0.12);
}

h1{
    margin-top:0;
    margin-bottom:8px;
    font-size:24px;
}

.bigstatus{
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.ok{
    color:green;
}

.alarm{

}

.offline{

}

.warn{
    color:#d98200;
}

.time{
    color:#666;
    margin-bottom:18px;
    font-size:15px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.box{
    background:#f7f7f7;
    border-radius:10px;
    padding:12px;
}

.label{
    color:#666;
    font-size:14px;
    margin-bottom:5px;
}

.value{
    font-size:22px;
    font-weight:bold;
}

.section{
    margin-top:18px;
}

.run,
.dayrow,
.outagerow{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid #e5e5e5;
    font-size:16px;
}

.run{
    padding:9px 0;
    font-size:17px;
}

.run:last-child,
.dayrow:last-child,
.outagerow:last-child{
    border-bottom:none;
}

.small{
    color:#666;
    font-size:14px;
}

.alarm_list{
    margin-top:8px;
    font-size:15px;
    line-height:1.5;
}

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr;
    }

    .bigstatus{
        font-size:26px;
    }

    .value{
        font-size:20px;
    }

    .run,
    .dayrow,
    .outagerow{
        font-size:15px;
    }
}

</style>

NALAGANJE...

-

<div class="grid">

</div>

</div>

const OFFLINE_AFTER_HOURS = 3;

const API_HEADERS = {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${SUPABASE_KEY}`
};

function pad2(n){
    return String(n).padStart(2, '0');
}

function safeParseJson(value){

    if(!value){
        return {};
    }

    if(typeof value === 'object'){
        return value;
    }

    try{
        return JSON.parse(value);
    } catch(error){
        console.error('Napaka pri branju JSON:', error);
        return {};
    }
}

function formatShortRun(startEpoch, endEpoch){

    const s = new Date(startEpoch * 1000);
    const e = new Date(endEpoch * 1000);

    const sameDay =
        s.getFullYear() === e.getFullYear() &&
        s.getMonth() === e.getMonth() &&
        s.getDate() === e.getDate();

    const today = new Date();

    const isToday =
        s.getFullYear() === today.getFullYear() &&
        s.getMonth() === today.getMonth() &&
        s.getDate() === today.getDate();

    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);

    const isYesterday =
        s.getFullYear() === yesterday.getFullYear() &&
        s.getMonth() === yesterday.getMonth() &&
        s.getDate() === yesterday.getDate();

    let dayText;

    if(isToday){
        dayText = 'Danes';
    } else if(isYesterday){
        dayText = 'Včeraj';
    } else {
        dayText =
            pad2(s.getDate()) + '.' +
            pad2(s.getMonth() + 1) + '.';
    }

    const startTime =
        pad2(s.getHours()) + ':' +
        pad2(s.getMinutes());

    const endTime =
        pad2(e.getHours()) + ':' +
        pad2(e.getMinutes());

    if(sameDay){
        return dayText + ' ' + startTime + '–' + endTime;
    }

    return dayText + ' ' + startTime + '–' +
        pad2(e.getDate()) + '.' +
        pad2(e.getMonth() + 1) + '. ' +
        endTime;
}

function formatDuration(sec){

    sec = Number(sec);

    if(!Number.isFinite(sec) || sec < 0){
        return '0 min';
    }

    const min = Math.round(sec / 60);

    if(min < 60){
        return min + ' min';
    }

    const h = Math.floor(min / 60);
    const m = min % 60;

    if(m === 0){
        return h + ' h';
    }

    return h + ' h ' + m + ' min';
}

function formatAgo(sec){

    sec = Number(sec);

    if(!Number.isFinite(sec) || sec < 0){
        return '-';
    }

    const min = Math.floor(sec / 60);

    if(min < 60){
        return min + ' min nazaj';
    }

    const h = Math.floor(min / 60);

    if(h < 48){
        return h + ' h nazaj';
    }

    const d = Math.floor(h / 24);

    return d + ' dni nazaj';
}


function formatDayDate(dateStr){

    const parts = dateStr.split('-');

    if(parts.length !== 3){
        return dateStr;
    }

    const y = Number(parts[0]);
    const m = Number(parts[1]);
    const d = Number(parts[2]);

    const date = new Date(y, m - 1, d);

    const weekdays = [
        'Nedelja',
        'Ponedeljek',
        'Torek',
        'Sreda',
        'Četrtek',
        'Petek',
        'Sobota'
    ];

    return weekdays[date.getDay()] + ' ' + d + '.' + m + '.';
}

}

function formatMonth(monthKey){

    const parts = String(monthKey).split('-');

    if(parts.length !== 2){
        return monthKey;
    }

    return parts[0] + '.' + parts[1];
}

function isoWeekMonday(year, week){

    const january4 = new Date(Date.UTC(year, 0, 4));
    const day = january4.getUTCDay() || 7;

    const monday = new Date(january4);
    monday.setUTCDate(january4.getUTCDate() - day + 1 + (week - 1) * 7);

    return monday;
}

function formatWeekRange(weekKey){

    const match = String(weekKey).match(/^(\d{4})-W(\d{1,2})$/);

    if(!match){
        return weekKey;
    }

    const year = Number(match[1]);
    const week = Number(match[2]);

    const start = isoWeekMonday(year, week);
    const end = new Date(start);
    end.setUTCDate(start.getUTCDate() + 6);

    return (
        pad2(start.getUTCDate()) + '.' +
        pad2(start.getUTCMonth() + 1) + '–' +
        pad2(end.getUTCDate()) + '.' +
        pad2(end.getUTCMonth() + 1) + '.' +
        end.getUTCFullYear()
    );
}

function formatHoursAndM3(sec, flowRate){

    const seconds = Number(sec) || 0;
    const hours = seconds / 3600;
    const m3 = hours * flowRate;

    return (
        hours.toFixed(2) +
        ' h = ' +
        m3.toFixed(2) +
        ' m3'
    );
}

async function fetchLatest(tableName){

    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${tableName}?select=*&order=id.desc&limit=1`,
        {
            headers: API_HEADERS,
            cache: 'no-store'
        }
    );

    if(!response.ok){
        throw new Error(
            `Napaka ${response.status} pri branju ${tableName}`
        );
    }

    const data = await response.json();

    return data.length ? data[0] : null;
}

async function loadData(){

    try{

        const [statusRow, statsRow] = await Promise.all([
            fetchLatest('pump_status'),
            fetchLatest('pump_stats')
        ]);

        if(!statusRow){
            throw new Error('V tabeli pump_status ni podatkov.');
        }

        const d = statusRow;
        const extra = safeParseJson(d.report);

        const stats = statsRow
            ? safeParseJson(statsRow.stats)
            : {};

        const updateDate = new Date(d.created_at);
        const now = new Date();

        const diffHours =
            (now.getTime() - updateDate.getTime()) /
            1000 /
            60 /
            60;

        const nowSec =
            Math.floor(now.getTime() / 1000);

        const noRunWarningSec =
            Number(extra.no_run_warning_sec) || 43200;

        const lastRunEpoch =
            Number(extra.last_run_epoch) || 0;

        const noRunTooLong =
            !d.pump_running &&
            lastRunEpoch > 0 &&
            (nowSec - lastRunEpoch) >= noRunWarningSec;

        document.getElementById('update_time').textContent =
            'Posodobljeno: ' +
            updateDate.toLocaleString('sl-SI');

        // GLAVNI STATUS

        const mainStatus =
            document.getElementById('main_status');

        if(diffHours >= OFFLINE_AFTER_HOURS){

            mainStatus.textContent =
                '🔴 VODOVOD OFFLINE';

            mainStatus.className =
                'bigstatus offline';

        } else if(d.alarm){

            mainStatus.textContent =
                '⚠ ALARM';

            mainStatus.className =
                'bigstatus alarm';

        } else if(noRunTooLong){

            mainStatus.textContent =
                '🟠 VODOVOD NI OK';

            mainStatus.className =
                'bigstatus warn';

        } else {

            mainStatus.textContent =
                '🟢 VODOVOD OK';

            mainStatus.className =
                'bigstatus ok';
        }

        // TRENUTNO STANJE

        document.getElementById('pump_state').textContent =
            d.pump_running ? 'ČRPA' : 'MIRUJE';

        document.getElementById('daily_hours').textContent =
            Number(d.daily_hours || 0).toFixed(2);

        document.getElementById('daily_m3').textContent =
            Number(d.daily_m3 || 0).toFixed(2);

        document.getElementById('last_event').textContent =
            d.last_event || '-';

        document.getElementById('last_run_ago').textContent =
            lastRunEpoch > 0
            ? formatAgo(nowSec - lastRunEpoch)
            : '-';

        // PRETOK

        const flowRate =
            Number(stats.flow_rate_m3_per_h) ||
            Number(extra.flow_rate_m3_per_h) ||
            4;

        // ZADNJI 4 VKLOPI

        const runs =
            Array.isArray(extra.last_runs)
            ? extra.last_runs
            : [];

        const runsBox =
            document.getElementById('last_runs');

        if(!runs.length){

            runsBox.innerHTML =
                '<div class="small">Ni podatkov.</div>';

        } else {

            runsBox.innerHTML = runs.map(run => `
                <div class="run">
                    <span>
                        ${formatShortRun(run.start, run.end)}
                    </span>
                    <b>
                        ${formatDuration(run.duration_sec)}
                    </b>
                </div>
            `).join('');
        }

        // ZADNJIH 8 ZAKLJUČENIH DNI

        const days =
            Array.isArray(stats.last_days)
            ? stats.last_days
            : [];

        const daysBox =
            document.getElementById('last_days');

        if(!days.length){

            daysBox.innerHTML =
                '<div class="small">Ni podatkov.</div>';

        } else {

            daysBox.innerHTML = days.map(day => `
                <div class="dayrow">
                    <span>${formatDayDate(day.date)}</span>
                    <b>${formatHoursAndM3(day.sec, flowRate)}</b>
                </div>
            `).join('');
        }

        // ZADNJIH 5 ZAKLJUČENIH TEDNOV

        const weeks =
            Array.isArray(stats.last_weeks)
            ? stats.last_weeks
            : [];

        const weeksBox =
            document.getElementById('last_weeks');

        if(!weeks.length){

            weeksBox.innerHTML =
                '<div class="small">Ni podatkov.</div>';

        } else {

            weeksBox.innerHTML = weeks.map(week => `
                <div class="dayrow">
                    <span>${formatWeekRange(week.week)}</span>
                    <b>${formatHoursAndM3(week.sec, flowRate)}</b>
                </div>
            `).join('');
        }

        // ZADNJIH 13 ZAKLJUČENIH MESECEV

        const months =
            Array.isArray(stats.last_months)
            ? stats.last_months
            : [];

        const monthsBox =
            document.getElementById('last_months');

        if(!months.length){

            monthsBox.innerHTML =
                '<div class="small">Ni podatkov.</div>';

        } else {

            monthsBox.innerHTML = months.map(month => `
                <div class="dayrow">
                    <span>${formatMonth(month.month)}</span>
                    <b>${formatHoursAndM3(month.sec, flowRate)}</b>
                </div>
            `).join('');
        }

        // ZADNJI IZPADI

        const outages =
            Array.isArray(extra.last_outages)
            ? extra.last_outages
            : [];

        const outagesBox =
            document.getElementById('last_outages');

        if(!outages.length){

            outagesBox.innerHTML =
                '<div class="small">Ni zabeleženih izpadov.</div>';

        } else {

          outagesBox.innerHTML = outages.map(outage => `
    <div class="outagerow">
        <span>
            ${new Date(outage.start * 1000).toLocaleString('sl-SI')}
        </span>
        <b>IZPAD</b>
    </div>
`).join('');
        }

        // ALARMI

        const alarms = [];

        if(d.continuous_alarm){
            alarms.push(
                'Pumpa deluje predolgo neprekinjeno.'
            );
        }

        if(d.no_start_alarm){
            alarms.push(
                'Pumpa se predolgo ni vklopila.'
            );
        }

        if(d.daily_runtime_alarm){
            alarms.push(
                'Pumpa je danes skupaj delovala predolgo.'
            );
        }

        if(noRunTooLong){
            alarms.push(
                'Pumpa ni delovala več kot ' +
                Math.round(noRunWarningSec / 3600) +
                ' h.'
            );
        }

        if(diffHours >= OFFLINE_AFTER_HOURS){
            alarms.push(
                'Podatki niso bili posodobljeni več kot ' +
                OFFLINE_AFTER_HOURS +
                ' h.'
            );
        }

        document.getElementById('alarm_list').innerHTML =
            alarms.length
            ? alarms.join('<br>')
            : 'Ni aktivnih alarmov.';

    } catch(error){

        document.getElementById('main_status').textContent =
            '🔴 NAPAKA PRI BRANJU';

        document.getElementById('main_status').className =
            'bigstatus offline';

        document.getElementById('update_time').textContent =
            error.message || String(error);

        console.error(error);
    }
}

loadData();

setInterval(loadData, 30000);

</script>

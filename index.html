<!DOCTYPE html>
<html lang="sl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vodovod Kaplja vas</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f3f3f3;
    padding:12px;
    margin:0;
}

.card{
    background:white;
    max-width:760px;
    margin:auto;
    padding:18px;
    border-radius:14px;
    box-shadow:0 0 12px rgba(0,0,0,0.12);
}

h1{
    margin-top:0;
    margin-bottom:8px;
    font-size:24px;
}

.bigstatus{
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.ok{
    color:green;
}

.alarm{
    color:red;
}

.offline{
    color:darkred;
}

.warn{
    color:#d98200;
}

.time{
    color:#666;
    margin-bottom:18px;
    font-size:15px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.box{
    background:#f7f7f7;
    border-radius:10px;
    padding:12px;
}

.label{
    color:#666;
    font-size:14px;
    margin-bottom:5px;
}

.value{
    font-size:22px;
    font-weight:bold;
}

.section{
    margin-top:18px;
}

.run{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid #e5e5e5;
    font-size:17px;
}

.run:last-child{
    border-bottom:none;
}

.small{
    color:#666;
    font-size:14px;
}

.alarm_list{
    margin-top:8px;
    font-size:15px;
    line-height:1.5;
}

@media(max-width:600px){
    .grid{
        grid-template-columns:1fr;
    }

    .bigstatus{
        font-size:26px;
    }

    .value{
        font-size:20px;
    }

    .run{
        font-size:16px;
    }
}

</style>

</head>

<body>

<div class="card">

<h1>VODOVOD Kaplja vas</h1>

<div id="main_status" class="bigstatus">
NALAGANJE...
</div>

<div id="update_time" class="time">
-
</div>

<div class="grid">

<div class="box">
    <div class="label">Status črpanja</div>
    <div id="pump_state" class="value">-</div>
</div>

<div class="box">
    <div class="label">Danes</div>
    <div class="value">
        <span id="daily_hours">-</span> h =
        <span id="daily_m3">-</span> m3
    </div>
</div>

<div class="box">
    <div class="label">Zadnje delovanje</div>
    <div id="last_run_ago" class="value">-</div>
</div>

<div class="box">
    <div class="label">Zadnji dogodek</div>
    <div id="last_event" class="value">-</div>
</div>

</div>

<div class="section">
    <div class="label">Zadnji 3 vklopi</div>
    <div id="last_runs">
        -
    </div>
</div>

<div class="section">
    <div class="label">Alarmi</div>
    <div id="alarm_list" class="alarm_list">
        -
    </div>
</div>

</div>

<script>

const SUPABASE_URL =
'https://bndblzdwhqxrgxatqrxm.supabase.co';

const SUPABASE_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZGJsemR3aHF4cmd4YXRxcnhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjE0MTgsImV4cCI6MjA5NDA5NzQxOH0.OmKY2hWbE1-V4VOqeaQCLBt4vmpUg8oOqV7SupcN4EE';

const OFFLINE_AFTER_HOURS = 3;

function pad2(n){
    return String(n).padStart(2,'0');
}

function formatDateTime(epoch){
    if(!epoch || epoch <= 0){
        return '-';
    }

    const d = new Date(epoch * 1000);

    return d.toLocaleString('sl-SI', {
        day:'2-digit',
        month:'2-digit',
        year:'numeric',
        hour:'2-digit',
        minute:'2-digit'
    });
}

function formatShortRun(startEpoch, endEpoch){
    const s = new Date(startEpoch * 1000);
    const e = new Date(endEpoch * 1000);

    const sameDay =
        s.getFullYear() === e.getFullYear() &&
        s.getMonth() === e.getMonth() &&
        s.getDate() === e.getDate();

    const today = new Date();

    const isToday =
        s.getFullYear() === today.getFullYear() &&
        s.getMonth() === today.getMonth() &&
        s.getDate() === today.getDate();

    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);

    const isYesterday =
        s.getFullYear() === yesterday.getFullYear() &&
        s.getMonth() === yesterday.getMonth() &&
        s.getDate() === yesterday.getDate();

    let dayText;

    if(isToday){
        dayText = 'Danes';
    } else if(isYesterday){
        dayText = 'Včeraj';
    } else {
        dayText =
            pad2(s.getDate()) + '.' +
            pad2(s.getMonth() + 1) + '.';
    }

    const st = pad2(s.getHours()) + ':' + pad2(s.getMinutes());
    const et = pad2(e.getHours()) + ':' + pad2(e.getMinutes());

    if(sameDay){
        return dayText + ' ' + st + '–' + et;
    }

    return dayText + ' ' + st + '–' +
        pad2(e.getDate()) + '.' +
        pad2(e.getMonth() + 1) + '. ' + et;
}

function formatDuration(sec){
    if(!sec || sec < 0){
        return '0 min';
    }

    const min = Math.round(sec / 60);

    if(min < 60){
        return min + ' min';
    }

    const h = Math.floor(min / 60);
    const m = min % 60;

    if(m === 0){
        return h + ' h';
    }

    return h + ' h ' + m + ' min';
}

function formatAgo(sec){
    if(!sec || sec < 0){
        return '-';
    }

    const min = Math.floor(sec / 60);

    if(min < 60){
        return min + ' min nazaj';
    }

    const h = Math.floor(min / 60);

    if(h < 48){
        return h + ' h nazaj';
    }

    const d = Math.floor(h / 24);
    return d + ' dni nazaj';
}

function safeParseReport(report){
    if(!report){
        return {};
    }

    try{
        return JSON.parse(report);
    } catch(e){
        return {};
    }
}

async function loadData(){

    try{

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/pump_status?select=*&order=id.desc&limit=1`,
            {
                headers:{
                    apikey: SUPABASE_KEY,
                    Authorization: `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        const data = await response.json();

        if(!data.length){
            return;
        }

        const d = data[0];
        const extra = safeParseReport(d.report);

        const updateDate = new Date(d.created_at);
        const now = new Date();

        const diffHours =
            (now - updateDate) / 1000 / 60 / 60;

        const nowSec = Math.floor(now.getTime() / 1000);

        const noRunWarningSec =
            extra.no_run_warning_sec || 43200;

        const lastRunEpoch =
            extra.last_run_epoch || 0;

        const noRunTooLong =
            !d.pump_running &&
            lastRunEpoch > 0 &&
            (nowSec - lastRunEpoch) >= noRunWarningSec;

        document.getElementById('update_time').innerHTML =
            'Posodobljeno: ' + updateDate.toLocaleString('sl-SI');

        // GLAVNI STATUS

        if(diffHours >= OFFLINE_AFTER_HOURS){

            document.getElementById('main_status')
                .innerHTML = '🔴 VODOVOD OFFLINE';

            document.getElementById('main_status')
                .className = 'bigstatus offline';

        } else if(d.alarm){

            document.getElementById('main_status')
                .innerHTML = '⚠ ALARM';

            document.getElementById('main_status')
                .className = 'bigstatus alarm';

        } else if(noRunTooLong){

            document.getElementById('main_status')
                .innerHTML = '🟠 VODOVOD NI OK';

            document.getElementById('main_status')
                .className = 'bigstatus warn';

        } else {

            document.getElementById('main_status')
                .innerHTML = '🟢 VODOVOD OK';

            document.getElementById('main_status')
                .className = 'bigstatus ok';
        }

        // STANJE PUMPE

        document.getElementById('pump_state').innerHTML =
            d.pump_running ? 'ČRPA' : 'MIRUJE';

        document.getElementById('daily_hours').innerHTML =
            Number(d.daily_hours).toFixed(2);

        document.getElementById('daily_m3').innerHTML =
            Number(d.daily_m3).toFixed(2);

        document.getElementById('last_event').innerHTML =
            d.last_event || '-';

        if(lastRunEpoch > 0){
            document.getElementById('last_run_ago').innerHTML =
                formatAgo(nowSec - lastRunEpoch);
        } else {
            document.getElementById('last_run_ago').innerHTML =
                '-';
        }

        // ZADNJA 3 DELOVANJA

        const runs = extra.last_runs || [];
        const runsBox = document.getElementById('last_runs');

        if(!runs.length){

            runsBox.innerHTML = '<div class="small">Ni podatkov.</div>';

        } else {

            runsBox.innerHTML = runs.map(r => {
                return `
                    <div class="run">
                        <span>${formatShortRun(r.start, r.end)}</span>
                        <b>${formatDuration(r.duration_sec)}</b>
                    </div>
                `;
            }).join('');
        }

        // ALARMI

        let alarms = [];

        if(d.continuous_alarm){
            alarms.push('Pumpa deluje predolgo neprekinjeno.');
        }

        if(d.no_start_alarm){
            alarms.push('Pumpa se predolgo ni vklopila.');
        }

        if(d.daily_runtime_alarm){
            alarms.push('Pumpa je danes skupaj delovala predolgo.');
        }

        if(noRunTooLong){
            alarms.push('Pumpa ni delovala več kot ' +
                Math.round(noRunWarningSec / 3600) + ' h.');
        }

        if(diffHours >= OFFLINE_AFTER_HOURS){
            alarms.push('Podatki niso bili posodobljeni več kot ' +
                OFFLINE_AFTER_HOURS + ' h.');
        }

        document.getElementById('alarm_list').innerHTML =
            alarms.length ? alarms.join('<br>') : 'Ni aktivnih alarmov.';

    } catch(err){

        document.getElementById('main_status').innerHTML =
            '🔴 NAPAKA PRI BRANJU';

        document.getElementById('main_status').className =
            'bigstatus offline';

        document.getElementById('update_time').innerHTML =
            String(err);
    }
}

loadData();

setInterval(loadData, 30000);

</script>

</body>
</html>
